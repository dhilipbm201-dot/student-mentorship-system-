{% extends 'base.html' %}{% block content %}<h2>Feedback</h2>{% if accepted %}<form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label>Connection <select name="request_id">{% for a in accepted %}<option value="{{ a.id }}">{{ a.student_name }} / {{ a.mentor_name }}</option>{% endfor %}</select></label><p><label>Rating <input type="number" min="1" max="5" name="rating" required></label></p><p><label>Comments <textarea name="comments"></textarea></label></p><button>Save feedback</button></form>{% endif %}{% for f in rows %}<p>{{ f.author }}: {{ f.rating }}/5 — {{ f.comments }}</p>{% endfor %}{% endblock %}
