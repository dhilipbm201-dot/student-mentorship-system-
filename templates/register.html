{% extends 'base.html' %}{% block content %}<h2>Register</h2><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><p><label>Name <input name="name" required></label></p><p><label>Email <input type="email" name="email" required></label></p><p><label>Password <input type="password" name="password" minlength="8" required></label></p><p><label>Role <select name="role"><option>student</option><option>mentor</option></select></label></p>{% for field in ['department','year','interests','goals','availability','skills'] %}<p><label>{{ field|capitalize }} <input name="{{ field }}"></label></p>{% endfor %}<button>Register</button></form>{% endblock %}
